<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CardMax</title>
  <meta name="description" content="Track spends on HSBC Live+ and BOB Eterna and always pay with the card that earns more.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CardMax">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body data-view="home">
  <header class="navbar" aria-hidden="true"><span class="navbar-title"></span></header>
  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Sections">
    <button data-tab="home" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fillable" d="M3.5 10.2 12 3.5l8.5 6.7V20a1 1 0 0 1-1 1H15v-6.2H9V21H4.5a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </button>
    <button data-tab="history" aria-label="History">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 6.5h12M8.5 12h12M8.5 17.5h12"/><circle class="dotfill" cx="4.25" cy="6.5" r="1.2"/><circle class="dotfill" cx="4.25" cy="12" r="1.2"/><circle class="dotfill" cx="4.25" cy="17.5" r="1.2"/></svg>
      <span>History</span>
    </button>
    <button data-tab="friends" aria-label="Friends">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle class="fillable" cx="9" cy="8" r="3.2"/><path class="fillable" d="M3.5 19.5c0-3.2 2.5-5.6 5.5-5.6s5.5 2.4 5.5 5.6z"/><circle cx="16.8" cy="9" r="2.5"/><path d="M16 13.9c2.6-.2 4.8 1.8 4.8 4.6"/></svg>
      <span>Friends</span>
    </button>
    <button data-tab="insights" aria-label="Insights">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="fillable" x="4" y="12" width="4" height="8" rx="1.2"/><rect class="fillable" x="10" y="5" width="4" height="15" rx="1.2"/><rect class="fillable" x="16" y="9" width="4" height="11" rx="1.2"/></svg>
      <span>Insights</span>
    </button>
    <button data-tab="cards" aria-label="Cards">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="fillable" x="2.75" y="5.25" width="18.5" height="13.5" rx="2.5"/><path class="stripe" d="M2.75 9.75h18.5M6.5 15h4"/></svg>
      <span>Cards</span>
    </button>
  </nav>
  <button class="fab" data-tab="add" aria-label="Add a spend">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head" id="sheetHead"></div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </dialog>

  <div id="tip" class="tip" role="status" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"><span id="toastText"></span><button id="toastAction" type="button" hidden></button></div>
  <noscript>CardMax needs JavaScript turned on.</noscript>
</body>
</html>
